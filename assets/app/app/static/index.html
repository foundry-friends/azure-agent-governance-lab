<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>エージェント呼び出し</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
<main>
  <header><p>ガバナンス検証ラボ · サインイン済み</p><a id="logout" href="/.auth/logout">サインアウト</a></header>
  <h1>{{AGENT_NAME}}</h1>
  <p class="notice">実データを入力しないでください。架空の内容で、1 往復ずつ確認します。</p>
  <form id="ask-form">
    <label for="prompt">エージェントへの入力</label>
    <textarea id="prompt" rows="6" data-max-chars="{{MAX_PROMPT_CHARS}}" required></textarea>
    <p id="remaining"></p>
    <button id="send" type="submit">送信</button>
  </form>
  <section aria-labelledby="response-title"><h2 id="response-title">応答</h2><pre id="response"></pre></section>
  <p id="status" role="status" aria-live="polite">合成入力を送信してください。</p>
  <dl><dt>相関 ID</dt><dd id="correlation">—</dd><dt>失敗した層</dt><dd id="layer">—</dd></dl>
  <button id="save" type="button" disabled>会話メモを保存</button>
  <p id="memo-result"></p>
</main>
</body>
</html>
